# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  config:
    enable-lldb-debugging: false
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/json/host.json
    - assets/emojis/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: iconfont
      fonts:
        - asset: assets/fonts/iconfont.ttf
    - family: HarmonyOS_Sans
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_w300.ttf
          weight: 300
        - asset: assets/fonts/HarmonyOS_Sans_SC_w400.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans_SC_w500.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_SC_w600.ttf
          weight: 600
        - asset: assets/fonts/HarmonyOS_Sans_SC_w700.ttf
          weight: 700
        - asset: assets/fonts/HarmonyOS_Sans_SC_w800.ttf
          weight: 800
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
  generate: true

msix_config:
  display_name: Pixez
  publisher_display_name: Perol_Notsfsssf
  identity_name: com.perol.pixez
  logo_path: .\windows\runner\resources\ic_launcher-msstore.png
  trim_logo: false
  capabilities: internetClient, picturesLibrary
  languages: en-us, es-es, ja-jp, ko-kr, ru-ru, tr-tr, zh-cn, zh-tw
  protocol_activation: pixiv, pixez
  app_uri_handler_hosts: i.pximg.net, pixiv.me, pixivision.net
  execution_alias: pixez
  install_certificate: false
  store: false
  publisher: CN=Notsfsssf, C=CN

hooks:
  user_defines:
    sqlite3:
      source: sqlite3

